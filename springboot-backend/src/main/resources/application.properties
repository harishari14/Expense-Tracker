# ==============================================================================
# Java Spring Boot 3.3.4 Configuration (Standalone Zero Database Architecture)
# ==============================================================================
spring.application.name=expense-tracker-api
server.port=${PORT:8080}

# Swagger / OpenAPI Specification
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS Allowed Origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://*.run.app}
